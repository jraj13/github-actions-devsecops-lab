[project]
name = "github-actions-devsecops-lab"
version = "0.1.0"
description = "DevSecOps CI/CD reference implementation using GitHub Actions"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "bandit>=1.8",
    "build>=1.2",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]